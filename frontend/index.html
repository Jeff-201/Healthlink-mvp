<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="HealthLink — a modern digital healthcare platform for hospitals and patients. Manage triage, appointments, and care efficiently."
    />
    <meta name="theme-color" content="#2563eb" />

    <!-- App Title -->
    <title>HealthLink | Smart Hospital Platform</title>

    <!-- Favicon (adjust path if needed) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apple touch icon (for iOS PWA compatibility) -->
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Tailwind Typography & Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Optional: Light/Dark Mode Prefetch -->
    <script>
      // Respect system preference & saved user choice before the app loads
      (function () {
        const storedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>

  </head>

  <body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <!-- Root App Mount -->
    <div id="root" class="min-h-screen flex flex-col"></div>

    <!-- Optional Loading State -->
    <noscript>
      <p style="text-align: center; padding: 2rem;">
        HealthLink requires JavaScript to run. Please enable it in your browser settings.
      </p>
    </noscript>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
